<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya AI | Voice Interface</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0b0e14;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(79, 172, 254, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 254, 0.1) 0%, transparent 40%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .maya-orb-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .maya-orb {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 0 80px rgba(0, 242, 254, 0.4), inset 0 0 40px rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 5;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .maya-orb::after {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0.2;
            filter: blur(20px);
            z-index: -1;
        }

        .orb-ring {
            position: absolute;
            border: 2px solid var(--glass-border);
            border-radius: 50%;
            animation: rotate 10s linear infinite;
        }

        .ring-1 { width: 240px; height: 240px; border-top-color: var(--primary); }
        .ring-2 { width: 260px; height: 260px; border-bottom-color: var(--secondary); animation-duration: 15s; animation-direction: reverse; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .maya-orb.listening {
            transform: scale(1.1);
            animation: pulse 1.5s infinite ease-in-out;
            box-shadow: 0 0 120px rgba(0, 242, 254, 0.6);
        }

        .maya-orb.speaking {
            animation: waveform 0.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1.1); box-shadow: 0 0 80px rgba(0, 242, 254, 0.4); }
            50% { transform: scale(1.2); box-shadow: 0 0 140px rgba(0, 242, 254, 0.7); }
            100% { transform: scale(1.1); box-shadow: 0 0 80px rgba(0, 242, 254, 0.4); }
        }

        @keyframes waveform {
            0% { border-radius: 45% 55% 50% 50% / 50% 50% 45% 55%; }
            50% { border-radius: 55% 45% 55% 45% / 45% 55% 45% 55%; }
            100% { border-radius: 45% 55% 50% 50% / 50% 50% 45% 55%; }
        }

        .status-badge {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
        }

        .display-text {
            text-align: center;
            max-width: 600px;
            margin-top: 20px;
        }

        #user-speech {
            font-size: 20px;
            color: #fff;
            margin-bottom: 10px;
            min-height: 24px;
        }

        #maya-reply {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(to right, #fff, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-height: 28px;
        }

        .caption-container {
            position: fixed;
            bottom: 100px;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 100;
        }

        .caption-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 10px 30px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            max-width: 80%;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .caption-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .caption-text {
            font-size: 18px;
            color: #fff;
            line-height: 1.4;
        }

        .controls {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .btn-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: var(--card-bg);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .btn-circle:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .btn-talk {
            width: 80px;
            height: 80px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--primary);
            font-size: 30px;
            color: var(--primary);
        }

        .btn-talk:hover {
            background: var(--primary);
            color: var(--bg);
        }

        .listening-indicator {
            display: none;
            position: absolute;
            bottom: -30px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-badge">
            <div class="status-dot"></div>
            MAYA AI ONLINE
        </div>

        <div class="maya-orb-container">
            <div class="orb-ring ring-1"></div>
            <div class="orb-ring ring-2"></div>
            <div id="maya" class="maya-orb"></div>
            <div id="listening-text" class="listening-indicator">System Listening</div>
        </div>

        <div class="display-text">
            <div id="user-speech"></div>
            <div id="maya-reply">Maya is ready to assist you.</div>
        </div>

        <!-- Conversation history (dynamic) -->
        <div id="history" style="position:fixed; right:20px; top:20px; width:320px; max-height:70vh; overflow:auto; z-index:200;">
            <div style="background:rgba(0,0,0,0.35); padding:8px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.04); color:#fff; font-weight:600;">Conversation</div>
            <div id="history-items" style="margin-top:8px; display:flex; flex-direction:column; gap:8px; padding:8px;"></div>
        </div>

        <div class="caption-container">
            <div id="caption-box" class="caption-box">
                <div id="caption-text" class="caption-text"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-circle" id="settings-btn" title="Settings">
                <i class="fas fa-cog"></i>
            </button>
            <button class="btn-circle btn-talk" id="talk-btn" title="Start Conversation">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="btn-circle" id="history-btn" title="View History">
                <i class="fas fa-history"></i>
            </button>
        </div>
    </div>

    <div id="processing-spinner" style="position:fixed; left:20px; bottom:20px; width:48px; height:48px; display:none; align-items:center; justify-content:center; z-index:200;">
        <div style="width:40px; height:40px; border-radius:50%; border:4px solid rgba(255,255,255,0.08); border-top-color:var(--primary); animation:spin 1s linear infinite;"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const btn = document.getElementById('talk-btn');
        const userSpeech = document.getElementById('user-speech');
        const mayaReply = document.getElementById('maya-reply');
        const maya = document.getElementById('maya');
        const listeningIndicator = document.getElementById('listening-text');
        const captionBox = document.getElementById('caption-box');
        const captionText = document.getElementById('caption-text');

        // Setup SpeechRecognition if available
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
        let recognition = null;
        if (SpeechRec) {
            recognition = new SpeechRec();
            recognition.lang = 'en-US';
            recognition.interimResults = true;
        }

        let isListening = false;

        btn.addEventListener('click', () => {
            if (btn.disabled) return; // ignore clicks when disabled
            if (!isListening) {
                startListening();
            } else {
                stopListening();
            }
        });

        // Fallback: allow typed input if SpeechRecognition not available or permission denied
        function showTextFallback() {
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Type your question and press Enter';
            input.style.padding = '10px';
            input.style.width = '420px';
            input.style.borderRadius = '8px';
            input.style.border = '1px solid rgba(255,255,255,0.08)';
            document.querySelector('.container').appendChild(input);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && input.value.trim()) {
                    socket.emit('voice-data', input.value.trim());
                    mayaReply.innerText = 'Sent: ' + input.value.trim();
                    input.value = '';
                }
            });
        }

        async function checkMicrophone() {
            // If SpeechRecognition not supported, show fallback
            if (!recognition) {
                userSpeech.innerText = 'SpeechRecognition not supported in this browser.';
                showTextFallback();
                return;
            }

            try {
                // Try to get microphone permission
                await navigator.mediaDevices.getUserMedia({ audio: true });
                userSpeech.innerText = 'Microphone ready. Click the mic to speak.';
            } catch (err) {
                console.error('Microphone permission denied or not available:', err);
                userSpeech.innerText = 'Microphone permission denied. Use the text input.';
                showTextFallback();
            }
        }

        // Run mic check on load
        checkMicrophone();

        function startListening() {
            if (!recognition) {
                userSpeech.innerText = 'SpeechRecognition unsupported — use the text input.';
                return;
            }
            try {
                recognition.start();
            } catch (err) {
                console.error('Recognition start error:', err);
                userSpeech.innerText = 'Unable to start microphone. Check permission.';
                return;
            }
            isListening = true;
            maya.classList.add('listening');
            listeningIndicator.style.display = 'block';
            userSpeech.innerText = 'Listening...';
            btn.innerHTML = '<i class="fas fa-stop"></i>';
            btn.style.borderColor = '#ff4b2b';
            btn.style.color = '#ff4b2b';
            // Disable further clicks until response cycle completes
            btn.disabled = true;
            btn.setAttribute('aria-disabled', 'true');
        }

        function stopListening() {
            recognition.stop();
            isListening = false;
            maya.classList.remove('listening');
            listeningIndicator.style.display = 'none';
            btn.innerHTML = '<i class="fas fa-microphone"></i>';
            btn.style.borderColor = 'var(--primary)';
            btn.style.color = 'var(--primary)';
            // Keep button disabled until server reply handled
        }

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            
            userSpeech.innerText = transcript;
            console.log('🎤 Live Transcript:', transcript);

            if (event.results[event.results.length - 1].isFinal) {
                console.log('🚀 Final Transcript Sending:', transcript);
                    socket.emit('voice-data', transcript);
                    addHistoryItem('You', transcript);
                    stopListening();
                    // show temporary status while waiting
                    mayaReply.innerText = 'Processing...';
            }
        };

        recognition.onerror = (event) => {
            console.error('Speech Recognition Error:', event.error);
            userSpeech.innerText = 'Error: ' + event.error;
            stopListening();
        };

        socket.on('connect', () => {
            console.log('Connected to server');
            mayaReply.innerText = 'Connected to Maya. Ready to talk.';
        });

        socket.on('disconnect', () => {
            console.warn('Disconnected from server');
            mayaReply.innerText = 'Connection lost. Reconnecting...';
        });

        // Show processing status from server
        socket.on('maya-status', (obj) => {
            try {
                if (!obj) return;
                if (obj.status === 'processing') {
                    mayaReply.innerText = 'Processing...';
                    maya.classList.add('listening');
                    listeningIndicator.style.display = 'block';
                    document.getElementById('processing-spinner').style.display = 'flex';
                } else if (obj.status === 'done') {
                    // clear busy state
                    maya.classList.remove('listening');
                    listeningIndicator.style.display = 'none';
                    document.getElementById('processing-spinner').style.display = 'none';
                } else if (obj.status === 'error') {
                    mayaReply.innerText = 'Error: ' + (obj.error || 'server');
                    maya.classList.remove('listening');
                    listeningIndicator.style.display = 'none';
                    btn.disabled = false;
                    document.getElementById('processing-spinner').style.display = 'none';
                }
            } catch (e) { console.error('maya-status handler error', e); }
        });

        function addHistoryItem(who, text) {
            try {
                const container = document.getElementById('history-items');
                const el = document.createElement('div');
                el.style.background = 'rgba(255,255,255,0.03)';
                el.style.border = '1px solid rgba(255,255,255,0.03)';
                el.style.padding = '8px 10px';
                el.style.borderRadius = '8px';
                el.style.fontSize = '13px';
                el.style.color = '#fff';
                el.innerHTML = `<strong style="color:var(--primary);">${who}</strong>: <span style="color:#ddd;">${text}</span>`;
                container.insertBefore(el, container.firstChild);
            } catch (e) { console.error('addHistoryItem error', e); }
        }

        socket.on('maya-reply', (text) => {
            console.log('🤖 Maya Replied:', text);
            const replyText = (typeof text === 'string') ? text : String(text || '');
            addHistoryItem('Maya', replyText);
            // Typewriter effect for reply
            function typeWriter(el, text, speed=18) {
                el.innerText = '';
                let i=0;
                const iv = setInterval(()=>{
                    el.innerText += text.charAt(i) || '';
                    i++;
                    if (i>text.length) clearInterval(iv);
                }, speed);
            }
            typeWriter(mayaReply, replyText || 'No response');
            maya.classList.add('speaking');

            // Show caption
            captionText.innerText = replyText;
            captionBox.classList.add('visible');

            // Cancel any queued speech and speak the reply
            try { window.speechSynthesis.cancel(); } catch (e) {}
            const speech = new SpeechSynthesisUtterance(replyText);
            // Prefer Indian/Hinglish voices if available
            const voices = window.speechSynthesis.getVoices();
            const preferred = voices.find(v => /Hindi|Indian|India|Hi-IN|hi-IN|Hindi/.test(v.name) || /hi-?in|en-?in/.test(v.lang));
            if (preferred) {
                speech.voice = preferred;
                speech.lang = preferred.lang || 'hi-IN';
            } else {
                // fallback: choose female or default
                const femaleVoice = voices.find(v => /Female|Zira|Google Hindi|Google UK English Female|Google India/.test(v.name));
                if (femaleVoice) { speech.voice = femaleVoice; speech.lang = femaleVoice.lang || 'en-IN'; }
                else { speech.lang = 'en-IN'; }
            }
            speech.pitch = 1.1;
            speech.rate = 1.0;

            let reenabled = false;
            function enableButton() {
                if (reenabled) return; reenabled = true;
                btn.disabled = false;
                btn.removeAttribute('aria-disabled');
            }

            speech.onend = () => {
                console.log('🔊 Finished speaking');
                maya.classList.remove('speaking');
                // Hide caption after speaking
                setTimeout(() => { captionBox.classList.remove('visible'); }, 1500);
                enableButton();
            };

            // Safety: if speech synthesis not available, re-enable after 4s
            setTimeout(() => { enableButton(); }, 4000);

            try { window.speechSynthesis.speak(speech); } catch (e) { console.error('TTS error', e); enableButton(); }
        });

        // Initialize voices
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
